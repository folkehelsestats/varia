<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Stick Puzzle</title>

<style>
body{
    margin:0;
    padding:10px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

h2{
    margin:10px 0;
}

#status{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

#controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:10px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

canvas{
    background:white;
    border:1px solid #999;
    width:100%;
    max-width:700px;
    touch-action:none;
}

#failBox{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:#b71c1c;
    color:white;
    z-index:1000;
}

.failTitle{
    font-size:min(18vw,100px);
    font-weight:bold;
}

.failText{
    font-size:min(6vw,30px);
    margin:20px;
}
</style>
</head>
<body>

<h2>Flytt 3 pinner</h2>

<div id="status">
Tid: <span id="timer">00:00</span><br>
Pinner flyttet:
<span id="stickCount">0 / 3</span>
</div>

<div id="controls">
<button id="startBtn">Start</button>
<button id="undoBtn">Angre</button>
<button id="resetBtn">Nullstill</button>
</div>

<canvas id="canvas" width="700" height="500"></canvas>

<div id="failBox">
<div>
<div class="failTitle">FAIL</div>
<div class="failText">
Du flyttet mer enn 3 pinner<br>
Prøv igjen
</div>
<button id="retryBtn">Prøv igjen</button>
</div>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const STICK_LENGTH=140;

const dot={
    x:520,
    y:145,
    r:14
};

const originalSticks=[
    {x:260,y:290,length:STICK_LENGTH,angle:Math.PI/2},
    {x:400,y:290,length:STICK_LENGTH,angle:Math.PI/2},
    {x:330,y:360,length:STICK_LENGTH,angle:0},
    {x:295,y:185,length:STICK_LENGTH,angle:-1.04},
    {x:365,y:185,length:STICK_LENGTH,angle:1.04}
];

let sticks=
JSON.parse(JSON.stringify(originalSticks));

let movedSticks=new Set();
let history=[];

let selectedStick=null;
let rotatingStick=null;

let lastX=0;
let lastY=0;

let previousTouchAngle=null;

let gameStarted=false;
let timerInterval=null;
let elapsedTime=0;
let startTime=0;

function updateStickCount(){
    document.getElementById("stickCount").textContent=
    movedSticks.size+" / 3";
}

function formatTime(sec){
    const m=
    String(Math.floor(sec/60))
    .padStart(2,"0");

    const s=
    String(sec%60)
    .padStart(2,"0");

    return m+":"+s;
}

function startTimer(){

    startTime=
    Date.now()-elapsedTime*1000;

    timerInterval=
    setInterval(()=>{
        elapsedTime=
        Math.floor(
            (Date.now()-startTime)/1000
        );

        document.getElementById("timer")
        .textContent=
        formatTime(elapsedTime);

    },1000);
}

function stopTimer(){
    clearInterval(timerInterval);
}

function saveState(){

    history.push({
        sticks:
        JSON.parse(JSON.stringify(sticks)),
        moved:
        [...movedSticks]
    });

    if(history.length>100){
        history.shift();
    }
}

function registerStick(index){

    if(!movedSticks.has(index)){

        if(movedSticks.size>=3){

            failGame();
            return false;
        }

        movedSticks.add(index);
        updateStickCount();
    }

    return true;
}

function failGame(){

    stopTimer();

    gameStarted=false;

    document.getElementById("timer")
    .textContent="00:00";

    elapsedTime=0;

    document.getElementById("startBtn")
    .textContent="Start";

    document.getElementById("failBox")
    .style.display="flex";
}

function getEndpoints(stick){

    const dx=
    Math.cos(stick.angle)*
    stick.length/2;

    const dy=
    Math.sin(stick.angle)*
    stick.length/2;

    return{
        x1:stick.x-dx,
        y1:stick.y-dy,
        x2:stick.x+dx,
        y2:stick.y+dy
    };
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(
        dot.x,
        dot.y,
        dot.r,
        0,
        Math.PI*2
    );
    ctx.fill();

    sticks.forEach((s,i)=>{

        const p=getEndpoints(s);

        ctx.strokeStyle=
        i===selectedStick
        ? "#d32f2f"
        : "#a0522d";

        ctx.lineWidth=10;
        ctx.lineCap="square";

        ctx.beginPath();
        ctx.moveTo(p.x1,p.y1);
        ctx.lineTo(p.x2,p.y2);
        ctx.stroke();

        ctx.fillStyle="#1976d2";
        ctx.beginPath();
        ctx.arc(
            s.x,
            s.y,
            14,
            0,
            Math.PI*2
        );
        ctx.fill();
    });
}

function lineDistance(px,py,s){

    const p=getEndpoints(s);

    const A=px-p.x1;
    const B=py-p.y1;
    const C=p.x2-p.x1;
    const D=p.y2-p.y1;

    let param=
    (A*C+B*D)/(C*C+D*D);

    param=
    Math.max(0,Math.min(1,param));

    const xx=p.x1+param*C;
    const yy=p.y1+param*D;

    return Math.hypot(px-xx,py-yy);
}

function pointerDown(x,y){

    if(!gameStarted)return;

    for(let i=sticks.length-1;i>=0;i--){

        const d=
        Math.hypot(
        x-sticks[i].x,
        y-sticks[i].y);

        if(d<20){

            if(!registerStick(i))
                return;

            saveState();

            selectedStick=i;

            lastX=x;
            lastY=y;

            draw();

            return;
        }
    }
}

function pointerMove(x,y){

    if(selectedStick===null)
        return;

    if(rotatingStick!==null)
        return;

    sticks[selectedStick].x+=x-lastX;
    sticks[selectedStick].y+=y-lastY;

    lastX=x;
    lastY=y;

    draw();
}

function pointerUp(){

    selectedStick=null;
    rotatingStick=null;
    previousTouchAngle=null;
}

canvas.addEventListener("mousedown",e=>{

    const r=
    canvas.getBoundingClientRect();

    pointerDown(
        e.clientX-r.left,
        e.clientY-r.top
    );

});

canvas.addEventListener("mousemove",e=>{

    const r=
    canvas.getBoundingClientRect();

    pointerMove(
        e.clientX-r.left,
        e.clientY-r.top
    );

});

window.addEventListener("mouseup",pointerUp);

/* DESKTOP ROTATION */

canvas.addEventListener("wheel",e=>{

    e.preventDefault();

    const r=
    canvas.getBoundingClientRect();

    const x=e.clientX-r.left;
    const y=e.clientY-r.top;

    for(let i=0;i<sticks.length;i++){

        const d=Math.hypot(
            x-sticks[i].x,
            y-sticks[i].y
        );

        if(d<25){

            if(!registerStick(i))
                return;

            saveState();

            sticks[i].angle+=
            e.deltaY>0 ? 0.12 : -0.12;

            draw();

            return;
        }
    }

},{passive:false});

/* MOBILE */

canvas.addEventListener("touchstart",e=>{

    e.preventDefault();

    const r=
    canvas.getBoundingClientRect();

    if(e.touches.length===1){

        const t=e.touches[0];

        pointerDown(
            t.clientX-r.left,
            t.clientY-r.top
        );
    }

    if(
        e.touches.length===2 &&
        selectedStick!==null
    ){

        rotatingStick=
        selectedStick;

        const t1=e.touches[0];
        const t2=e.touches[1];

        previousTouchAngle=
        Math.atan2(
            t2.clientY-t1.clientY,
            t2.clientX-t1.clientX
        );
    }

},{passive:false});

canvas.addEventListener("touchmove",e=>{

    e.preventDefault();

    const r=
    canvas.getBoundingClientRect();

    if(
        e.touches.length===1 &&
        rotatingStick===null &&
        selectedStick!==null
    ){

        const t=e.touches[0];

        pointerMove(
            t.clientX-r.left,
            t.clientY-r.top
        );
    }

    if(
        e.touches.length===2 &&
        rotatingStick!==null
    ){

        const t1=e.touches[0];
        const t2=e.touches[1];

        const angle=
        Math.atan2(
            t2.clientY-t1.clientY,
            t2.clientX-t1.clientX
        );

        const delta=
        angle-previousTouchAngle;

        sticks[rotatingStick].angle+=delta;

        previousTouchAngle=angle;

        draw();
    }

},{passive:false});

canvas.addEventListener("touchend",e=>{

    e.preventDefault();

    if(e.touches.length===1){

        rotatingStick=null;
        previousTouchAngle=null;

        const r=
        canvas.getBoundingClientRect();

        const t=e.touches[0];

        lastX=t.clientX-r.left;
        lastY=t.clientY-r.top;

        return;
    }

    if(e.touches.length===0){

        selectedStick=null;
        rotatingStick=null;
        previousTouchAngle=null;
    }

},{passive:false});

document.getElementById("startBtn")
.addEventListener("click",()=>{

    if(!gameStarted){

        elapsedTime=0;
        document.getElementById("timer")
        .textContent="00:00";

        gameStarted=true;

        document.getElementById("startBtn")
        .textContent="Stop";

        startTimer();
    }
    else{

        stopTimer();

        gameStarted=false;

        document.getElementById("startBtn")
        .textContent="Start";

        alert(
            "Tid: "+
            formatTime(elapsedTime)+
            "\nPinner flyttet: "+
            movedSticks.size
        );
    }

});

document.getElementById("undoBtn")
.addEventListener("click",()=>{

    if(history.length===0)
        return;

    const state=history.pop();

    sticks=
    JSON.parse(JSON.stringify(state.sticks));

    movedSticks=
    new Set(state.moved);

    updateStickCount();

    draw();
});

document.getElementById("resetBtn")
.addEventListener("click",resetGame);

document.getElementById("retryBtn")
.addEventListener("click",()=>{

    document.getElementById("failBox")
    .style.display="none";

    resetGame();
});

function resetGame(){

    stopTimer();

    gameStarted=false;

    sticks=
    JSON.parse(JSON.stringify(originalSticks));

    movedSticks=new Set();
    history=[];

    elapsedTime=0;

    document.getElementById("timer")
    .textContent="00:00";

    document.getElementById("startBtn")
    .textContent="Start";

    updateStickCount();

    draw();
}

updateStickCount();
draw();

</script>
</body>
</html>
